<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor Remy — Projet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1787068994">
</head>
<body class="project-sober-bg">

<header class="site-banner">
  <img src="assets/bandeau.png" alt="" class="banner-bg">
  <nav class="banner-nav">
    <a href="#" data-modal="apropos">À propos</a>
    <a href="index.html" class="brand">Victor Remy</a>
    <a href="#" data-modal="contact">Contact</a>
  </nav>
</header>
<p class="path-breadcrumb" id="path-text"></p>
<button class="retour-btn" data-retour>← Retour</button>

<main class="page" id="project-detail" style="max-width: 1000px; margin: 0 auto;">
  <!-- Rempli automatiquement par renderProjectDetail() selon ?id=... dans l'URL -->
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/branches-config.js?v=1787067707"></script>
<script src="js/main.js?v=1787068994"></script>
<script>
  initInfoBubbles();
  loadAppearanceSettings();
  loadTyphonSettings();

  Promise.all([loadProjectsData(), loadChapterLayouts()]).then(() => {
    renderProjectDetail("project-detail", "path-text");
    const container = document.getElementById("project-detail");
    mountBlockCanvases(container);

    const params = new URLSearchParams(window.location.search);
    if(params.get("edit") === "1"){
      const project = PROJECTS.find(p => p.id === params.get("id"));
      if(project) initChapterEditor(project);
    }
  });

  // Fond statique ici : le retour n'a pas besoin de l'effet zoom, juste l'historique
  document.querySelector("[data-retour]").addEventListener("click", (e) => {
    e.preventDefault();
    window.history.back();
  });
</script>

</body>
</html>
