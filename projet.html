<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>
  // Redirige les anciens liens partageables projet.html?id=XXX
  // vers la nouvelle SPA index.html#/projet/XXX
  (function(){
    var params = new URLSearchParams(location.search);
    var id = params.get("id");
    if(id){
      location.replace("index.html#/projet/" + id);
    } else {
      location.replace("index.html#/hub");
    }
  })();
</script>
</head>
<body></body>
</html>
